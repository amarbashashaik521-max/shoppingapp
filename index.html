<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase</title>

    <link rel="stylesheet" href="app.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">ShopEase</div>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <button id="cart-button">
                🛒 Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </nav>


    <section class="hero" id="home">

        <div class="hero-content">
            <h1>Shop Smart. Live Better.</h1>

            <p>
                Discover quality products at amazing prices.
            </p>

            <a href="#products" class="hero-button">
                Explore Products
            </a>
        </div>

    </section>


    <section class="shop-controls">

        <input
            type="text"
            id="search-input"
            placeholder="Search products..."
        >

        <div class="categories">
            <button class="category-button active" data-category="All">
                All
            </button>

            <button class="category-button" data-category="Electronics">
                Electronics
            </button>

            <button class="category-button" data-category="Fashion">
                Fashion
            </button>

            <button class="category-button" data-category="Home">
                Home
            </button>

            <button class="category-button" data-category="Accessories">
                Accessories
            </button>
        </div>

    </section>



    <section class="products-section" id="products">

        <h2>Our Products</h2>

        <div id="product-container">
            <!-- Products will be generated using JavaScript -->
        </div>

    </section>


    <section class="cart-section" id="cart">

        <h2>Your Cart</h2>

        <div id="cart-items">

            <p id="empty-cart">
                Your cart is empty.
            </p>

        </div>

        <div class="cart-summary">

            <h3>
                Total:
                <span id="cart-total">₹0</span>
            </h3>

            <button id="checkout-button">
                Checkout
            </button>

        </div>

    </section>


    <footer>

        <p>
            © 2026 ShopEase. All Rights Reserved.
        </p>

    </footer>


    <script src="app.js"></script>

</body>

</html>
